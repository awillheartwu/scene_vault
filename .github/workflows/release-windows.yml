name: release-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release commit is merged into main
        shell: pwsh
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release commit must be merged into main before packaging."
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Point pnpm store into the workspace
        shell: pwsh
        run: pnpm config set store-dir "$env:GITHUB_WORKSPACE/.pnpm-store"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build installers (small + AI)
        shell: pwsh
        run: |
          $svReleaseVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $svReleaseVersion = $env:GITHUB_REF_NAME -replace '^v',''
          }
          ./scripts/release-windows.ps1 -SkipAffinity -Version $svReleaseVersion

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: scene-vault-installers
          path: dist-release/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*.exe
          body_path: docs/RELEASE_NOTES.md
